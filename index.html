<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Panel Micro Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: columna central única. Cabecera con meta, cuadrícula de 30 ventas, gráfico, y días desplegables. */
:root{
  --bg:#f3f8fd; --surface:#ffffff; --surface2:#eaf3fb; --line:#d6e6f5;
  --fg:#1f3a5c; --muted:#6a86a6; --accent:#6fb1e8; --accent-strong:#3d85c6; --accent-soft:#d9ecfb;
  --good:#7fcf9f; --good-soft:#d8f2e2; --good-strong:#3f9c68; --grid:#e3eef8;
  --font-body:'Figtree',system-ui,sans-serif; --font-display:'Outfit','Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b2b; --surface:#16283c; --surface2:#1b3149; --line:#27435f;
  --fg:#e3effb; --muted:#8fb0cf; --accent:#6fb1e8; --accent-strong:#8cc6f3; --accent-soft:#1f3f5d;
  --good:#6fcf97; --good-soft:#1c3f33; --good-strong:#8be0ad; --grid:#223a53; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b2b; --surface:#16283c; --surface2:#1b3149; --line:#27435f;
  --fg:#e3effb; --muted:#8fb0cf; --accent:#6fb1e8; --accent-strong:#8cc6f3; --accent-soft:#1f3f5d;
  --good:#6fcf97; --good-soft:#1c3f33; --good-strong:#8be0ad; --grid:#223a53; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 56px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h2{font-size:18px;font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface2);border-radius:14px;padding:14px 16px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:99px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sq{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);font:600 14px var(--font-display);cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .12s,background .15s}
.sq:hover{transform:translateY(-2px);border-color:var(--accent)}
.sq[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#0f3a24}
.sq[data-v="2"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--surface);position:relative}
.sq[data-v="2"]::after{content:"+";position:absolute;top:2px;right:6px;font-size:13px}
.sq.sel{outline:2px solid var(--fg);outline-offset:2px}
.picker{margin-top:14px;padding:14px;background:var(--surface2);border-radius:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picker strong{font-family:var(--font-display);margin-right:auto}
.picker button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--font-body);padding:8px 14px;border-radius:10px;cursor:pointer}
.picker button.on{background:var(--good);border-color:var(--good);color:#0f3a24}
.picker button.on.up{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--surface)}
.picker button.x{color:var(--muted)}
.sq:focus-visible,.day summary:focus-visible,.task input:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--font-body);padding:6px 14px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(40,90,140,.18)}
.chart{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:480px}
svg text{fill:var(--muted);font:11px var(--font-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.days{display:flex;flex-direction:column;gap:8px}
.day{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.day[open]{border-color:var(--accent)}
.day summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px}
.day summary::-webkit-details-marker{display:none}
.day summary::after{content:"›";margin-left:auto;font-size:20px;color:var(--muted);transition:transform .15s}
.day[open] summary::after{transform:rotate(90deg)}
.dname{font-weight:600;text-transform:capitalize;min-width:0}
.today{font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-strong);padding:2px 8px;border-radius:99px;margin-left:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--good-soft);color:var(--good-strong)}
.pill.sales{background:var(--accent-soft);color:var(--accent-strong)}
.body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer}
.task:hover{background:var(--surface2)}
.task input{width:20px;height:20px;accent-color:var(--good-strong);flex:none;margin:0}
.task input:checked+span{color:var(--muted);text-decoration:line-through}
.salesrow{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px;background:var(--surface2);border-radius:12px;flex-wrap:wrap}
.salesrow label{font-weight:600}
.num{display:inline-flex;align-items:center;gap:6px}
.num button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 18px var(--font-display);cursor:pointer}
.num input{width:64px;height:34px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 16px var(--font-body)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Método de las Micro Apps</h1>
      <p id="sub"></p>
    </div>
    <span class="sync" id="sync">Cargando…</span>
  </header>

  <section class="card" aria-labelledby="h-prog">
    <div class="cardhead"><h2 id="h-prog">Progreso del mes</h2></div>
    <div class="stats" id="stats"></div>
    <div class="bar" role="progressbar" aria-label="Avance hacia la meta" id="pbar"><i id="pfill"></i></div>
  </section>

  <section class="card" aria-labelledby="h-sq">
    <div class="cardhead"><h2 id="h-sq">Mis 30 ventas</h2><span class="note" style="margin:0">Tocá un cuadrito por cada venta y elegí si compró el upsell</span></div>
    <div class="grid" id="grid"></div>
    <div class="picker" id="picker" hidden></div>
  </section>

  <section class="card" aria-labelledby="h-ch">
    <div class="cardhead">
      <h2 id="h-ch">Evolución</h2>
      <div class="seg" role="group" aria-label="Tipo de gráfico">
        <button id="m-day" aria-pressed="true">Por día</button>
        <button id="m-acc" aria-pressed="false">Acumulado</button>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section aria-labelledby="h-days">
    <div class="cardhead"><h2 id="h-days">Tareas por día</h2></div>
    <div class="days" id="days"></div>
  </section>
</div>

<script>
(function(){
  var GOAL = 30, NET = 25.76, UP = 6.48, selected = -1;
  function money(x){ return '$' + x.toFixed(2); }
  var TASKS = ['Subir 3 reels al perfil','Subir 1 carrusel','Subir una secuencia de historias','Agregar un creativo a las campañas'];
  var now = new Date();
  var Y = now.getFullYear(), M = now.getMonth();
  var dim = new Date(Y, M+1, 0).getDate();
  var today = now.getDate();
  var mk = Y + '-' + String(M+1).padStart(2,'0');
  function dk(d){ return mk + '-' + String(d).padStart(2,'0'); }

  var state = { squares:{}, days:{} };
  var store = null, mode = 'day', openSet = {}; openSet[today] = true;
  var saving = false, dirty = false, timer = null;

  function $(id){ return document.getElementById(id); }
  function sq(){ var a = state.squares[mk]; if(!a){ a = state.squares[mk] = []; } while(a.length < GOAL) a.push(0); for(var i=0;i<a.length;i++){ if(a[i]===true) a[i]=1; else if(a[i]===false) a[i]=0; } return a; }
  function day(d){ var k = dk(d); if(!state.days[k]) state.days[k] = {t:[false,false,false,false], s:0}; return state.days[k]; }
  function salesOf(d){ var x = state.days[dk(d)]; return x ? (x.s||0) : 0; }
  function tasksDone(d){ var x = state.days[dk(d)]; return x ? x.t.filter(Boolean).length : 0; }

  /* ---------- guardado ---------- */
  function setSync(t){ $('sync').textContent = t; }
  function save(){
    dirty = true; setSync('Guardando…');
    clearTimeout(timer); timer = setTimeout(flush, 500);
  }
  async function flush(){
    if(saving){ timer = setTimeout(flush, 300); return; }
    saving = true; dirty = false;
    try{
      if(store){ await store.set({ data: JSON.stringify(state) }); setSync('Guardado'); }
      else { localStorage.setItem('microapps-state', JSON.stringify(state)); setSync('Guardado en este navegador'); }
    }catch(e){ setSync('No se pudo guardar'); }
    saving = false;
    if(dirty) flush();
  }
  async function load(){
    try{
      var db = await window.claude.use('db');
      if(db){ store = db.doc('app/state'); var s = await store.get(); if(s.exists){ state = JSON.parse(s.data().data); } setSync('Guardado'); return; }
    }catch(e){}
    store = null;
    try{ var raw = localStorage.getItem('microapps-state'); if(raw) state = JSON.parse(raw); }catch(e){}
    setSync('Guardado en este navegador');
  }

  /* ---------- resumen ---------- */
  function renderStats(){
    var a = sq(), n = a.filter(Boolean).length, ups = a.filter(function(v){return v===2;}).length;
    var left = Math.max(0, dim - today + 1);
    var need = n >= GOAL ? 0 : (GOAL - n) / left;
    $('stats').innerHTML =
      '<div class="stat"><b>'+n+' / '+GOAL+'</b><span>Ventas</span></div>'+
      '<div class="stat"><b>'+money(n*NET+ups*UP)+'</b><span>Ingresos netos</span></div>'+
      '<div class="stat"><b>'+ups+' / '+n+'</b><span>Compraron upsell</span></div>'+
      '<div class="stat"><b>'+left+'</b><span>Días restantes</span></div>'+
      '<div class="stat"><b>'+(n>=GOAL?'¡Meta!':need.toFixed(1))+'</b><span>Ventas por día para llegar</span></div>';
    $('pfill').style.width = Math.min(100, n/GOAL*100)+'%';
    $('pbar').setAttribute('aria-valuenow', n); $('pbar').setAttribute('aria-valuemax', GOAL);
    $('sub').textContent = new Date(Y,M,1).toLocaleDateString('es',{month:'long',year:'numeric'}) + ' · meta de ' + GOAL + ' ventas';
  }
  function renderGrid(){
    var a = sq(), h = '';
    for(var i=0;i<GOAL;i++) h += '<button class="sq'+(i===selected?' sel':'')+'" data-i="'+i+'" data-v="'+a[i]+'" aria-pressed="'+(a[i]>0)+'" aria-label="Venta '+(i+1)+(a[i]===2?' con upsell':a[i]===1?' sin upsell':'')+'">'+(i+1)+'</button>';
    $('grid').innerHTML = h;
  }

  /* ---------- gráfico ---------- */
  function renderChart(){
    var W=640,H=260,L=34,R=12,T=14,B=26, pw=W-L-R, ph=H-T-B;
    var vals=[], acc=0, accs=[];
    for(var d=1; d<=dim; d++){ var v = d<=today ? salesOf(d) : null; vals.push(v); if(v!==null){ acc+=v; } accs.push(d<=today?acc:null); }
    var series = mode==='day' ? vals : accs;
    var maxV = Math.max.apply(null, series.filter(function(x){return x!==null;}).concat([mode==='day'?3:GOAL]));
    if(mode==='acc') maxV = Math.max(GOAL, maxV);
    var step = maxV<=5?1:(maxV<=12?2:5); maxV = Math.ceil(maxV/step)*step;
    function X(d){ return L + (d-0.5)/dim*pw; }
    function Yy(v){ return T + ph - v/maxV*ph; }
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de ventas">';
    for(var g=0; g<=maxV; g+=step){ s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Yy(g)+'" y2="'+Yy(g)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Yy(g)+4)+'" text-anchor="end">'+g+'</text>'; }
    for(var d2=1; d2<=dim; d2++){ if(d2===1||d2%5===0||d2===dim) s += '<text x="'+X(d2)+'" y="'+(H-8)+'" text-anchor="middle">'+d2+'</text>'; }
    if(mode==='day'){
      var bw = Math.min(16, pw/dim*0.66);
      vals.forEach(function(v,i){
        if(v===null) return;
        var d=i+1, y=Yy(v), hh = Math.max(v>0?3:1.5, ph-(y-T));
        s += '<rect x="'+(X(d)-bw/2)+'" y="'+(T+ph-hh)+'" width="'+bw+'" height="'+hh+'" rx="4" fill="'+(v>0?'var(--good)':'var(--grid)')+'"><title>Día '+d+': '+v+' ventas</title></rect>';
        if(v>0) s += '<text x="'+X(d)+'" y="'+(y-5)+'" text-anchor="middle" style="fill:var(--fg);font-weight:600">'+v+'</text>';
      });
    } else {
      s += '<line x1="'+X(1)+'" y1="'+Yy(GOAL/dim)+'" x2="'+X(dim)+'" y2="'+Yy(GOAL)+'" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".6"/>';
      s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Yy(GOAL)+'" y2="'+Yy(GOAL)+'" stroke="var(--good-strong)" stroke-dasharray="2 4"/><text x="'+(W-R)+'" y="'+(Yy(GOAL)-5)+'" text-anchor="end" style="fill:var(--good-strong);font-weight:600">Meta '+GOAL+'</text>';
      var pts = accs.map(function(v,i){return v===null?null:[X(i+1),Yy(v)];}).filter(Boolean);
      if(pts.length){
        var line = pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('');
        s += '<path d="'+line+'L'+pts[pts.length-1][0]+' '+(T+ph)+'L'+pts[0][0]+' '+(T+ph)+'Z" fill="var(--accent)" opacity=".18"/>';
        s += '<path d="'+line+'" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
        var e = pts[pts.length-1];
        s += '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="5" fill="var(--accent-strong)" stroke="var(--surface)" stroke-width="2"/><text x="'+e[0]+'" y="'+(e[1]-10)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+accs[today-1]+'</text>';
      }
    }
    s += '</svg>';
    $('chart').innerHTML = s;
    $('legend').innerHTML = mode==='day'
      ? '<span style="--c:var(--good)">Ventas del día</span><span>Total registrado por día: '+acc+'</span>'
      : '<span style="--c:var(--accent-strong)">Ventas acumuladas</span><span style="--c:var(--muted)">Ritmo necesario</span><span style="--c:var(--good-strong)">Meta</span>';
  }

  /* ---------- días ---------- */
  function pillHtml(d){
    var t = tasksDone(d), s = salesOf(d);
    return '<span class="pill'+(t===4?' done':'')+'" id="pt'+d+'">'+t+'/4 tareas</span><span class="pill sales" id="ps'+d+'">'+s+(s===1?' venta':' ventas')+'</span>';
  }
  function renderDays(){
    var h='';
    for(var d=today; d>=1; d--){
      var x = day(d), date = new Date(Y,M,d);
      h += '<details class="day" data-d="'+d+'"'+(openSet[d]?' open':'')+'><summary><span class="dname">'+date.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+(d===today?'<span class="today">Hoy</span>':'')+'</span>'+pillHtml(d)+'</summary><div class="body">';
      TASKS.forEach(function(t,i){ h += '<label class="task"><input type="checkbox" data-d="'+d+'" data-t="'+i+'"'+(x.t[i]?' checked':'')+'><span>'+t+'</span></label>'; });
      h += '<div class="salesrow"><label for="sv'+d+'">Ventas de este día</label><span class="num"><button data-d="'+d+'" data-step="-1" aria-label="Restar una venta">−</button><input id="sv'+d+'" type="number" min="0" inputmode="numeric" value="'+(x.s||0)+'" data-d="'+d+'"><button data-d="'+d+'" data-step="1" aria-label="Sumar una venta">+</button></span></div></div></details>';
    }
    $('days').innerHTML = h;
  }
  function refreshDay(d){
    var el = document.getElementById('pt'+d); if(!el) return;
    var t = tasksDone(d), s = salesOf(d);
    el.textContent = t+'/4 tareas'; el.classList.toggle('done', t===4);
    document.getElementById('ps'+d).textContent = s+(s===1?' venta':' ventas');
  }
  function setSales(d, v){
    v = Math.max(0, Math.floor(Number(v)||0));
    day(d).s = v;
    var inp = document.getElementById('sv'+d); if(inp && Number(inp.value)!==v) inp.value = v;
    refreshDay(d); renderChart(); save();
  }

  /* ---------- eventos ---------- */
  $('grid').addEventListener('click', function(e){
    var b = e.target.closest('.sq'); if(!b) return;
    selected = +b.dataset.i; renderGrid(); renderPicker();
  });
  function renderPicker(){
    var p = $('picker'); if(selected<0){ p.hidden = true; return; }
    var v = sq()[selected]; p.hidden = false;
    p.innerHTML = '<strong>Venta '+(selected+1)+'</strong>'+
      '<button data-v="1" class="'+(v===1?'on':'')+'">Sin upsell · '+money(NET)+'</button>'+
      '<button data-v="2" class="up '+(v===2?'on':'')+'">Con upsell · '+money(NET+UP)+'</button>'+
      (v?'<button data-v="0" class="x">Quitar venta</button>':'')+
      '<button data-v="c" class="x">Cerrar</button>';
  }
  $('picker').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.v!=='c') sq()[selected] = +b.dataset.v;
    selected = -1; renderGrid(); renderPicker(); renderStats(); if(b.dataset.v!=='c') save();
  });
  $('days').addEventListener('change', function(e){
    var t = e.target;
    if(t.type==='checkbox'){ day(+t.dataset.d).t[+t.dataset.t] = t.checked; refreshDay(+t.dataset.d); save(); }
    else if(t.type==='number'){ setSales(+t.dataset.d, t.value); }
  });
  $('days').addEventListener('input', function(e){
    if(e.target.type==='number' && e.target.value!=='') setSales(+e.target.dataset.d, e.target.value);
  });
  $('days').addEventListener('click', function(e){
    var b = e.target.closest('button[data-step]'); if(!b) return;
    var d = +b.dataset.d; setSales(d, salesOf(d) + (+b.dataset.step));
  });
  $('days').addEventListener('toggle', function(e){
    var el = e.target; if(el.dataset && el.dataset.d) openSet[el.dataset.d] = el.open;
  }, true);
  function setMode(m){ mode = m; $('m-day').setAttribute('aria-pressed', m==='day'); $('m-acc').setAttribute('aria-pressed', m==='acc'); renderChart(); }
  $('m-day').onclick = function(){ setMode('day'); };
  $('m-acc').onclick = function(){ setMode('acc'); };

  function renderAll(){ renderStats(); renderGrid(); renderChart(); renderDays(); }
  renderAll();
  load().then(renderAll);
})();
</script>

</body>
</html>

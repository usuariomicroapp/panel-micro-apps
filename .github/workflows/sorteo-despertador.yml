# SORTEO · Mantiene despierta la base gratuita de Supabase (se pausa tras 7 días sin uso).
# Una consulta pública por día (solo lectura, clave pública). Gratis en GitHub Actions.
name: SORTEO despertador
on:
  schedule:
    - cron: '17 12 * * *' # todos los días 9:17 de Argentina
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar la configuración pública de la app
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ofuugwzkqhpfkaohnpgf.supabase.co/rest/v1/settings?select=brand_name" \
            -H "apikey: sb_publishable_Jy-O2SIZCucTbcilHKuvOA_9rqIPNTo")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
